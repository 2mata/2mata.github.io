baseURL: https://2mata.github.io/
locale: id
title: 2mata
copyright: "[2mata.github.io](/)"
theme: hyde


enableEmoji: true


# llms.txt — peta situs untuk agen AI (konvensi llmstxt.org).
# Digenerate dari konten oleh layouts/index.llms.txt supaya tidak pernah basi.
outputs:
  home:
    - HTML
    - RSS
    - llms

mediaTypes:
  text/plain:
    suffixes: [txt]

outputFormats:
  llms:
    mediaType: text/plain
    baseName: llms
    isPlainText: true


markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  tableOfContents:
    endLevel: 3
    ordered: false
    startLevel: 2
  

minify:
  tdewolff:
    html:
      keepQuotes: true

taxonomies:
  tag: tags
  author: author



related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
  - name: title
    weight: 100
  - name: keywords
    weight: 100
  - name: date
    weight: 100


Menus:
  main:
    - Name: "Blog"
      URL: "/blog/"
    - Name: "Tentang Kami"
      URL: "/about/"
    - Name: "Disclaimer"
      URL: "/disclaimer/"
    - Name: "Privacy Policy"
      URL: "/privacy-policy/"
    - Name: "Jasa Sadap iPhone"
      URL: "/blog/aplikasi-penyadap-hp/"
    - Name: "Jasa Sadap Android"
      URL: "/blog/aplikasi-sadap-hp/"
    - Name: "Sitemap"
      URL: "/sitemap-html/"

params: