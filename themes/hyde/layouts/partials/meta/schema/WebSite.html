{{- /* Schema WebSite (dipakai di HomePage).
       Catatan: WebSite TIDAK memuat author/datePublished.
       SearchAction dihapus karena situs tidak memiliki fitur pencarian. */ -}}
{{- $desc := .Description | default (printf "Panduan %s - %s" .Title .Site.Title) -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "url": {{ .Site.BaseURL | jsonify }},
  "name": {{ .Site.Title | jsonify }},
  "description": {{ $desc | jsonify }},
  "inLanguage": {{ or .Site.Language.Locale "id" | jsonify }},
  "publisher": {
    "@type": "Organization",
    "name": {{ .Site.Title | jsonify }},
    "url": {{ .Site.BaseURL | jsonify }},
    "logo": {
      "@type": "ImageObject",
      "url": {{ "logo.png" | absURL | jsonify }},
      "width": 600,
      "height": 60
    }
  }
}
</script>
